plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
 namespace 'org.romarr.android'
 compileSdk 36
 buildFeatures { buildConfig true }
 defaultConfig {
  applicationId 'org.romarr.android'
  minSdk 24
  targetSdk 36
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  versionCode 1
  versionName '1.10.0-preview'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
 }
 signingConfigs {
  if (System.getenv('ROMARR_ANDROID_SIGNING')) {
   preview {
    def secrets = new Properties()
    file(System.getenv('ROMARR_ANDROID_SIGNING')).withInputStream { secrets.load(it) }
    storeFile file(secrets.getProperty('storeFile'))
    storePassword secrets.getProperty('storePassword')
    keyAlias secrets.getProperty('keyAlias')
    keyPassword secrets.getProperty('keyPassword')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (System.getenv('ROMARR_ANDROID_SIGNING')) signingConfig signingConfigs.preview
  }
 }
}
tasks.register('stageROMarr', Sync) {
 from('../../../romarr') { include '**/*.py', '**/*.json' }
 into(layout.buildDirectory.dir('generated/python/romarr'))
}
chaquopy {
 defaultConfig {
  version = '3.13'
  buildPython System.getenv('ROMARR_BUILD_PYTHON') ?: 'python3.13'
  pip { install 'requests==2.32.5'; install 'urllib3==2.8.0'; install 'idna==3.20'; install 'charset-normalizer==3.5.2'; install 'certifi==2026.10.23' }
  extractPackages 'romarr'
 }
 sourceSets { main { srcDir layout.buildDirectory.dir('generated/python') } }
}
tasks.configureEach {
 if (name.startsWith('merge') && name.endsWith('PythonSources')) dependsOn 'stageROMarr'
}
dependencies { implementation 'androidx.core:core:1.17.0'; implementation 'androidx.activity:activity:1.11.0'; androidTestImplementation 'androidx.test:runner:1.7.0'; androidTestImplementation 'androidx.test.ext:junit:1.3.0' }
