<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROMarr servers</title><link rel="stylesheet" href="popup.css"></head><body><h1>ROMarr <small>Server Launcher</small></h1><p>Open your server and sign in there. A running ROMarr server is required.</p><section aria-label="Saved servers" id="profiles"></section><form id="add"><h2>Add server</h2><label for="name">Name</label><input id="name" required maxlength="60" autocomplete="off" placeholder="Home server"><label for="url">Server URL</label><input id="url" type="url" required maxlength="2048" autocomplete="off" placeholder="https://romarr.example.com/"><p>Use an HTTP or HTTPS address without passwords, keys, query parameters or fragments.</p><button type="submit">Save server</button></form><p id="status" role="status" aria-live="polite"></p><script src="validation.js"></script><script src="popup.js"></script></body></html>
