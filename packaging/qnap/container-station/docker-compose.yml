# ROMarr for QNAP QTS / QuTS hero Container Station 3.
#
# Container Station -> Applications -> Create. Application name: romarr. Paste this.
# Full guide: https://github.com/BlizzHacker/romarr/blob/main/docs/NAS.md#qnap-qts-and-quts-hero
#
# Create the folders below first and edit the left side of each path if yours
# differ. The library and downloads mounts refuse to start when their folder is
# missing, rather than filing games into a new empty folder nothing else reads.

services:
  romarr:
    image: ghcr.io/blizzhacker/romarr:1.15.0
    container_name: romarr
    restart: unless-stopped
    ports:
      - "6868:6868"
    environment:
      # The user that should own the games ROMarr files. 1000 is the first user created after admin on QTS and 100 is
      # "everyone". Do not use 0 (admin): files would land owned by root.
      PUID: 1000
      PGID: 100
      UMASK: "002"
      TZ: Etc/UTC
      LIBRARY_PATH: /roms
      # Optional: claim the install before the first visit.
      # ROMARR_PASSWORD: choose-something-long
    volumes:
      # Settings, history, API key and plugins. Back this folder up.
      - /share/Container/romarr:/config
      # Your game library: the folder RomM, Gaseous or your frontend reads.
      - type: bind
        source: /share/Multimedia/Games
        target: /roms
        bind:
          create_host_path: false
      # Your download client's completed folder. The right side must be the
      # path the client reports (Download Station reports /share/Download).
      - type: bind
        source: /share/Download
        target: /share/Download
        bind:
          create_host_path: false
