# ROMarr for TrueNAS SCALE 24.10+ : Apps -> Discover Apps -> (three dots) -> Install via YAML.
# Change the two host paths on the left of each volume to datasets you own.
services:
  romarr:
    image: ghcr.io/blizzhacker/romarr:1.14.1
    container_name: romarr
    restart: unless-stopped
    environment:
      PUID: "568"
      PGID: "568"
      TZ: Etc/UTC
      LIBRARY_PATH: /roms
    ports:
      - "6868:6868"
    volumes:
      - /mnt/tank/apps/romarr:/config
      - /mnt/tank/games/roms:/roms
