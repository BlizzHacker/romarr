name: Windows native smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare the native launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ROMarr native smoke'
          $data = Join-Path $root 'config'
          $library = Join-Path $root 'roms'
          $venv = Join-Path $root 'python environment'
          & .\scripts\start-windows.ps1 -PythonPath (Get-Command python).Source -DataDirectory $data -LibraryPath $library -VenvDirectory $venv -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Native preparation failed' }
      - name: Prove loopback health, authentication and persisted settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ROMarr native smoke'
          $data = Join-Path $root 'config'
          $library = Join-Path $root 'roms'
          $venv = Join-Path $root 'python environment'
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'scripts\start-windows.ps1'
          $env:ROMARR_API_KEY = 'windows-smoke-temporary-api-key'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $base = "http://127.0.0.1:$port"
          $headers = @{ 'X-Api-Key' = $env:ROMARR_API_KEY }
          $marker = Join-Path $venv '.romarr-requirements.sha256'
          $markerWrite = (Get-Item -LiteralPath $marker).LastWriteTimeUtc
          $arguments = @('-NoProfile', '-File', ('"' + $launcher + '"'), '-DataDirectory', ('"' + $data + '"'), '-LibraryPath', ('"' + $library + '"'), '-VenvDirectory', ('"' + $venv + '"'), '-Port', $port)
          function Start-Native([int]$Attempt) {
            return Start-Process -FilePath (Join-Path $PSHOME 'pwsh.exe') -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $root "stdout-$Attempt.log") -RedirectStandardError (Join-Path $root "stderr-$Attempt.log")
          }
          function Wait-Native($Process) {
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($Process.HasExited) { throw 'ROMarr exited before becoming healthy' }
              try {
                $health = Invoke-RestMethod -Uri "$base/api/health" -TimeoutSec 1
                if ($health.ok) { return }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            throw 'ROMarr health timed out'
          }
          function Stop-Native($Process) {
            if ($Process -and -not $Process.HasExited) {
              & taskkill.exe /PID $Process.Id /T /F | Out-Null
              $Process.WaitForExit(10000) | Out-Null
            }
          }
          $process = $null
          try {
            $process = Start-Native 1
            Wait-Native $process
            $health = Invoke-RestMethod -Uri "$base/api/health"
            if (($health.PSObject.Properties.Name -join ',') -ne 'ok') { throw 'Anonymous health exposed private configuration' }
            $anonymous = Invoke-WebRequest -Uri "$base/api/v1/config" -SkipHttpErrorCheck
            if ($anonymous.StatusCode -ne 401) { throw 'Private API did not require authentication' }
            $bound = Get-NetTCPConnection -State Listen -LocalPort $port
            if (@($bound | Where-Object LocalAddress -ne '127.0.0.1').Count) { throw 'Native launcher exposed a non-loopback listener' }
            Invoke-RestMethod -Uri "$base/api/v1/config" -Method Put -Headers $headers -ContentType 'application/json' -Body '{"preferred_regions":["EUR","USA"]}' | Out-Null
            $state = Join-Path $data 'romarr.json'
            if (-not (Test-Path -LiteralPath $state)) { throw 'State was not created in the selected configuration directory' }
            $persisted = Get-Content -LiteralPath $state -Raw | ConvertFrom-Json
            if (($persisted.settings.preferred_regions -join ',') -ne 'EUR,USA') { throw 'Settings were not written to disk' }
            Stop-Native $process
            $process = Start-Native 2
            Wait-Native $process
            $config = Invoke-RestMethod -Uri "$base/api/v1/config" -Headers $headers
            if (($config.preferred_regions -join ',') -ne 'EUR,USA') { throw 'Settings did not survive a restart' }
            if ((Get-Item -LiteralPath $marker).LastWriteTimeUtc -ne $markerWrite) { throw 'Unchanged dependencies were installed again' }
            Write-Host 'PASS: native Windows launch, loopback binding, health, authentication, selected state path, persistence and dependency reuse.'
          } finally {
            Stop-Native $process
            Get-ChildItem -LiteralPath $root -Filter '*.log' | ForEach-Object { Get-Content -LiteralPath $_.FullName }
          }
